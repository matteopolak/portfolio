name: Publish BaerScript web build

on:
  workflow_dispatch:
    inputs:
      baerscript_ref:
        description: BaerScript branch, tag, or commit to build
        required: true
        default: main
      update_repository:
        description: How to trigger the website rebuild
        required: true
        type: choice
        default: pointer
        options:
          - pointer
          - assets
          - none

concurrency:
  group: baerscript-web-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: baerscript-web-latest
  BAERSCRIPT_REPOSITORY: matteopolak/baerscript

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out portfolio default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: check out baerscript
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.BAERSCRIPT_REPOSITORY }}
          ref: ${{ inputs.baerscript_ref }}
          path: .build/baerscript

      - name: install rust and the webassembly target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - name: cache rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .build/baerscript -> target

      - name: install wasm tools
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-pack@0.15.0

      - name: install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install --yes binaryen

      - name: build browser module
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
          CARGO_PROFILE_RELEASE_PANIC: abort
          CARGO_PROFILE_RELEASE_DEBUG: '0'
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          wasm-pack build .build/baerscript/wasm \
            --target web \
            --release \
            --no-opt \
            --out-dir "$GITHUB_WORKSPACE/.build/baerscript-dist"
          wasm-opt \
            .build/baerscript-dist/baerscript_wasm_bg.wasm \
            --enable-bulk-memory \
            --enable-sign-ext \
            -Oz \
            -o .build/baerscript-dist/baerscript_wasm_bg.optimized.wasm
          mv \
            .build/baerscript-dist/baerscript_wasm_bg.optimized.wasm \
            .build/baerscript-dist/baerscript_wasm_bg.wasm

      - name: smoke-test the generated interpreter
        run: |
          node --input-type=module -e "
            import { readFile } from 'node:fs/promises';
            import init, { execute } from './.build/baerscript-dist/baerscript_wasm.js';
            await init({ module_or_path: await readFile('./.build/baerscript-dist/baerscript_wasm_bg.wasm') });
            const result = execute('+v\n+v\n>v', '', false, 100);
            if (!result.ok || result.stdout !== '2') throw new Error('unexpected result: ' + JSON.stringify(result));
          "

      - name: package bundle and metadata
        id: bundle
        run: |
          revision="$(git -C .build/baerscript rev-parse HEAD)"
          short_revision="${revision:0:12}"
          asset="baerscript-web-${short_revision}.tar.gz"
          tar -C .build/baerscript-dist -czf ".build/${asset}" .
          digest="$(sha256sum ".build/${asset}" | cut -d ' ' -f 1)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg bundleAsset "$asset" \
            --arg sha256 "$digest" \
            --arg baerscriptRevision "$revision" \
            '{enabled:true,repository:$repository,tag:$tag,bundleAsset:$bundleAsset,sha256:$sha256,baerscriptRevision:$baerscriptRevision}' \
            > .build/baerscript-web-release.json
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: retain workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baerscript-web-${{ steps.bundle.outputs.revision }}
          path: |
            .build/${{ steps.bundle.outputs.asset }}
            .build/baerscript-web-release.json
          retention-days: 30
          if-no-files-found: error

      - name: create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --latest=false --title 'Latest BaerScript web build'
          else
            gh release create "$RELEASE_TAG" --prerelease --latest=false --title 'Latest BaerScript web build' --notes 'Automated browser interpreter build.'
          fi
          gh release upload "$RELEASE_TAG" ".build/${{ steps.bundle.outputs.asset }}" --clobber
          gh release upload "$RELEASE_TAG" .build/baerscript-web-release.json --clobber

      - name: install pnpm
        if: ${{ inputs.update_repository != 'none' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: install node.js
        if: ${{ inputs.update_repository != 'none' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install portfolio dependencies
        if: ${{ inputs.update_repository != 'none' }}
        run: pnpm install --frozen-lockfile

      - name: update repository deployment pointer
        if: ${{ inputs.update_repository != 'none' }}
        env:
          UPDATE_MODE: ${{ inputs.update_repository }}
        run: |
          cp .build/baerscript-web-release.json releases/baerscript-web-release.json
          if [ "$UPDATE_MODE" = assets ]; then
            node scripts/sync-baerscript-web.ts
            git add -f public/baerscript
          fi
          pnpm format:check
          pnpm lint
          pnpm build
          git add releases/baerscript-web-release.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then
            echo 'Repository already points to this BaerScript build.'
          else
            git commit -m "chore: update BaerScript web build to ${{ steps.bundle.outputs.revision }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: remove superseded release bundles
        if: ${{ inputs.update_repository != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > .build/release-assets.txt
          while IFS= read -r asset; do
            case "$asset" in
              "${{ steps.bundle.outputs.asset }}"|baerscript-web-release.json) ;;
              '') ;;
              *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
            esac
          done < .build/release-assets.txt
