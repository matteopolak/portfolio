name: Publish Lodestone web SDK

on:
  workflow_dispatch:
    inputs:
      lodestone_ref:
        description: Lodestone branch, tag, or commit to build
        required: true
        default: main
      update_repository:
        description: How to trigger the website rebuild
        required: true
        type: choice
        default: pointer
        options:
          - pointer
          - assets
          - none

concurrency:
  group: lodestone-web-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: lodestone-web-latest
  LODESTONE_REPOSITORY: matteopolak/lodestone

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: check out portfolio default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: check out lodestone
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LODESTONE_REPOSITORY }}
          ref: ${{ inputs.lodestone_ref }}
          path: .build/lodestone
          token: ${{ secrets.LODESTONE_REPOSITORY_TOKEN || github.token }}

      - name: install rust and the webassembly target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-07
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: cache rust builds and minecraft downloads
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build/lodestone -> target
          cache-directories: .build/lodestone/.cache/mc/26.2

      - name: install java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: read wasm-bindgen version
        id: wasm_bindgen
        working-directory: .build/lodestone
        run: |
          version="$(python3 -c 'import pathlib, tomllib; lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text()); print(next(package["version"] for package in lock["package"] if package["name"] == "wasm-bindgen"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: install browser build tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,trunk@0.21.14,wasm-bindgen-cli@${{ steps.wasm_bindgen.outputs.version }}

      - name: fetch browser assets and generated reports
        working-directory: .build/lodestone
        run: |
          cargo run --release -p xtask -- fetch-assets --version 26.2
          cargo run --release -p xtask -- fetch-version --version 26.2
          cd .cache/mc/26.2
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --reports

      - name: build canonical browser sdk
        working-directory: .build/lodestone
        run: just wasm-sdk

      - name: verify and describe release assets
        id: bundle
        run: |
          archive=.build/lodestone/target/wasm-sdk/lodestone-web-sdk.tar.gz
          manifest=.build/lodestone/target/wasm-sdk/lodestone-web-sdk.manifest.json
          revision="$(jq -er '.commit' "$manifest")"
          archive_digest="$(jq -er '.archive.sha256' "$manifest")"
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$archive_digest"
          manifest_digest="$(sha256sum "$manifest" | cut -d ' ' -f 1)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg manifestAsset "lodestone-web-sdk.manifest.json" \
            --arg manifestSha256 "$manifest_digest" \
            --arg lodestoneRevision "$revision" \
            '{enabled:true,repository:$repository,tag:$tag,manifestAsset:$manifestAsset,manifestSha256:$manifestSha256,lodestoneRevision:$lodestoneRevision}' \
            > .build/lodestone-web-release.json
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: retain workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lodestone-web-${{ steps.bundle.outputs.revision }}
          path: |
            .build/lodestone/target/wasm-sdk/lodestone-web-sdk.tar.gz
            .build/lodestone/target/wasm-sdk/lodestone-web-sdk.manifest.json
            .build/lodestone-web-release.json
          retention-days: 30
          if-no-files-found: error

      - name: create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --latest=false --title 'Latest Lodestone web SDK'
          else
            gh release create "$RELEASE_TAG" --prerelease --latest=false --title 'Latest Lodestone web SDK' --notes 'Canonical embeddable browser SDK built by Lodestone.'
          fi
          gh release upload "$RELEASE_TAG" \
            .build/lodestone/target/wasm-sdk/lodestone-web-sdk.tar.gz \
            .build/lodestone/target/wasm-sdk/lodestone-web-sdk.manifest.json \
            .build/lodestone-web-release.json \
            --clobber

      - name: install pnpm
        if: ${{ inputs.update_repository != 'none' }}
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - name: install node.js
        if: ${{ inputs.update_repository != 'none' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install portfolio dependencies
        if: ${{ inputs.update_repository != 'none' }}
        run: pnpm install --frozen-lockfile

      - name: update repository deployment pointer
        if: ${{ inputs.update_repository != 'none' }}
        env:
          UPDATE_MODE: ${{ inputs.update_repository }}
        run: |
          cp .build/lodestone-web-release.json lodestone-web-release.json
          if [ "$UPDATE_MODE" = assets ]; then
            node scripts/sync-lodestone-web.mjs
            git add -f public/lodestone
          fi
          pnpm format:check
          pnpm lint
          pnpm build
          git add lodestone-web-release.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then
            echo 'repository already points to this Lodestone SDK'
          else
            git commit -m "chore: update Lodestone web SDK to ${{ steps.bundle.outputs.revision }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: remove superseded release assets
        if: ${{ inputs.update_repository != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > .build/release-assets.txt
          while IFS= read -r asset; do
            case "$asset" in
              lodestone-web-sdk.tar.gz|lodestone-web-sdk.manifest.json|lodestone-web-release.json|'') ;;
              *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
            esac
          done < .build/release-assets.txt
