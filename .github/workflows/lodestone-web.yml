name: Publish Lodestone web build

on:
  workflow_dispatch:
    inputs:
      lodestone_ref:
        description: Lodestone branch, tag, or commit to build
        required: true
        default: main
      update_repository:
        description: How to trigger the website rebuild (committing assets grows git history quickly)
        required: true
        type: choice
        default: pointer
        options:
          - pointer
          - assets
          - none
      include_sounds:
        description: Download the non-music sound corpus before staging the curated browser subset
        required: true
        type: boolean
        default: true

concurrency:
  group: lodestone-web-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: lodestone-web-latest
  LODESTONE_REPOSITORY: matteopolak/lodestone

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out portfolio default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out Lodestone
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LODESTONE_REPOSITORY }}
          ref: ${{ inputs.lodestone_ref }}
          path: .build/lodestone
          token: ${{ secrets.LODESTONE_REPOSITORY_TOKEN || github.token }}

      - name: Install Rust and the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds and Minecraft downloads
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build/lodestone -> target
          cache-directories: .build/lodestone/.cache/mc/26.2

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Fetch browser assets and generated reports
        working-directory: .build/lodestone
        run: |
          cargo run --release -p xtask -- fetch-assets --version 26.2
          cargo run --release -p xtask -- fetch-version --version 26.2
          cd .cache/mc/26.2
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --reports

      - name: Fetch browser sound corpus
        if: ${{ inputs.include_sounds }}
        working-directory: .build/lodestone
        run: cargo run --release -p xtask -- fetch-sounds --version 26.2 --jobs 12

      - name: Build singleplayer-only WebAssembly game
        working-directory: .build/lodestone/web
        env:
          LODESTONE_WEB_CLIENT_JAR_PARTS: '1'
        run: trunk build --release --no-default-features --public-url /lodestone/ --dist "$GITHUB_WORKSPACE/.build/lodestone-dist"

      - name: Enforce Cloudflare and multiplayer confinement
        run: |
          node scripts/prepare-lodestone-release.mjs .build/lodestone-dist
          cargo tree --manifest-path .build/lodestone/web/Cargo.toml --target wasm32-unknown-unknown --no-default-features -e features > .build/lodestone-features.txt
          grep -Fq 'lodestone-shell feature "live"' .build/lodestone-features.txt
          if grep -Fq 'lodestone-shell feature "multiplayer"' .build/lodestone-features.txt; then
            echo 'error: the multiplayer feature was enabled in the website build' >&2
            exit 1
          fi
          cargo tree --manifest-path .build/lodestone/web/Cargo.toml --target wasm32-unknown-unknown --no-default-features -e normal --prefix none > .build/lodestone-packages.txt
          grep -Eq '^lodestone-shell ' .build/lodestone-packages.txt
          if grep -Eq '^lodestone-relay( |$)' .build/lodestone-packages.txt; then
            echo 'error: lodestone-relay is reachable from the singleplayer website build' >&2
            exit 1
          fi

      - name: Package bundle and metadata
        id: bundle
        run: |
          revision="$(git -C .build/lodestone rev-parse HEAD)"
          short_revision="${revision:0:12}"
          asset="lodestone-web-${short_revision}.tar.gz"
          tar -C .build/lodestone-dist -czf ".build/${asset}" .
          digest="$(sha256sum ".build/${asset}" | cut -d ' ' -f 1)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg bundleAsset "$asset" \
            --arg sha256 "$digest" \
            --arg lodestoneRevision "$revision" \
            '{enabled:true,repository:$repository,tag:$tag,bundleAsset:$bundleAsset,sha256:$sha256,lodestoneRevision:$lodestoneRevision}' \
            > .build/lodestone-web-release.json
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Retain workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lodestone-web-${{ steps.bundle.outputs.revision }}
          path: |
            .build/${{ steps.bundle.outputs.asset }}
            .build/lodestone-web-release.json
          retention-days: 30
          if-no-files-found: error

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --latest=false --title 'Latest Lodestone web build'
          else
            gh release create "$RELEASE_TAG" --prerelease --latest=false --title 'Latest Lodestone web build' --notes 'Automated singleplayer-only browser build.'
          fi
          gh release upload "$RELEASE_TAG" ".build/${{ steps.bundle.outputs.asset }}" --clobber
          gh release upload "$RELEASE_TAG" .build/lodestone-web-release.json --clobber

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install portfolio dependencies
        run: pnpm install --frozen-lockfile

      - name: Update repository deployment pointer
        if: ${{ inputs.update_repository != 'none' }}
        env:
          UPDATE_MODE: ${{ inputs.update_repository }}
        run: |
          cp .build/lodestone-web-release.json lodestone-web-release.json
          if [ "$UPDATE_MODE" = assets ]; then
            node scripts/sync-lodestone-web.mjs
            git add -f public/lodestone
          fi
          pnpm lint
          pnpm build
          git add lodestone-web-release.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then
            echo 'Repository already points to this Lodestone build.'
          else
            git commit -m "Update Lodestone web build to ${{ steps.bundle.outputs.revision }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Remove superseded release bundles
        if: ${{ inputs.update_repository != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > .build/release-assets.txt
          while IFS= read -r asset; do
            case "$asset" in
              "${{ steps.bundle.outputs.asset }}"|lodestone-web-release.json) ;;
              '') ;;
              *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
            esac
          done < .build/release-assets.txt
