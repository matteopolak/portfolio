name: Publish Jai browser compiler

# Builds the playground's compiler from a Jacket release and pins it in
# releases/jai-web-release.json. Bump with `pnpm bump:jacket [tag]`, which
# defaults to the latest release.
on:
  workflow_dispatch:
    inputs:
      jai_ref:
        description: Jacket release tag (v0.19.1), `latest`, or a full 40-character commit SHA
        required: true
        default: latest
      update_pointer:
        description: Update the portfolio deployment pointer after validation
        type: boolean
        default: true

concurrency:
  group: jai-web-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      # Jacket's Python tools import their shared folders from tools/ (`from toolkit... import`).
      PYTHONPATH: ${{ github.workspace }}/.build/jai/tools
    steps:
      # A tag or `latest` becomes the exact commit everything below is pinned to.
      - name: Resolve the compiler revision
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.jai_ref }}
        run: |
          ref="$REQUESTED"
          if [ "$ref" = latest ]; then
            ref="$(gh release view -R matteopolak/jacket --json tagName --jq .tagName)"
          fi
          if ! [[ "$ref" =~ ^[a-f0-9]{40}$ ]]; then
            ref="$(gh api "repos/matteopolak/jacket/commits/$ref" --jq .sha)"
          fi
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          echo "$REQUESTED -> $ref"
          echo "JAI_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check out the compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matteopolak/jacket
          ref: ${{ env.JAI_REF }}
          path: .build/jai
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install the compiler's pinned toolchain
        working-directory: .build/jai
        run: |
          test "$(git rev-parse HEAD)" = "$JAI_REF"
          test -z "$(git status --porcelain)"
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$toolchain"
      # jaifmt.wasm is compiled by a native jaic, which needs LLVM 23 and lld (wasm-ld).
      - name: Install LLVM 23 and lld
        working-directory: .build/jai
        run: |
          # Releases from 0.19 keep these scripts in tools/<subsystem>/.
          tool() { for p in "tools/$1" tools/*/"$1"; do [ -f "$p" ] && { echo "$p"; return; }; done; echo "no $1 in tools/" >&2; return 1; }
          bash "$(tool install_ci_llvm_linux.sh)"
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .build/jai -> target
      - name: Check source policy and fetch locked dependencies
        working-directory: .build/jai
        run: |
          tool() { for p in "tools/$1" tools/*/"$1"; do [ -f "$p" ] && { echo "$p"; return; }; done; echo "no $1 in tools/" >&2; return 1; }
          python3 "$(tool check_dependency_age.py)"
          python3 "$(tool check_ci_sources.py)"
          cargo fetch --locked
      - name: Build the native compiler that builds jaifmt.wasm
        working-directory: .build/jai
        run: |
          cargo build --locked -p jaic-cli
          command -v wasm-ld
      - name: Build and package the actual browser compiler
        working-directory: .build/jai
        run: |
          tool() { for p in "tools/$1" tools/*/"$1"; do [ -f "$p" ] && { echo "$p"; return; }; done; echo "no $1 in tools/" >&2; return 1; }
          python3 "$(tool package_browser_release.py)" --output "$GITHUB_WORKSPACE/.build/jai-release" --jaic "$PWD/target/debug/jaic"
      - name: Validate inventory and pin release digests
        run: |
          python3 scripts/verify-jai-bundle.py .build/jai-release "$JAI_REF"
          python3 - <<'PY'
          import hashlib, json, os, tomllib
          from pathlib import Path
          directory = Path('.build/jai-release')
          revision = os.environ['JAI_REF']
          digest = lambda name: hashlib.sha256((directory / name).read_bytes()).hexdigest()
          cargo = tomllib.loads(Path('.build/jai/Cargo.toml').read_text())
          pointer = dict(enabled=True, repository=os.environ['GITHUB_REPOSITORY'],
                         revision=revision, version=cargo['workspace']['package']['version'],
                         tag='jai-web-' + revision,
                         manifestAsset='jai-playground.manifest.json',
                         manifestSha256=digest('jai-playground.manifest.json'),
                         bundleAsset='jai-playground.zip', sha256=digest('jai-playground.zip'))
          Path('.build/jai-web-release.json').write_text(json.dumps(pointer, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jai-web-${{ env.JAI_REF }}
          path: |
            .build/jai-release/jai-playground.zip
            .build/jai-release/jai-playground.manifest.json
            .build/jai-web-release.json
          if-no-files-found: error
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="jai-web-$JAI_REF"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir .build/existing-jai-release
            gh release download "$tag" --pattern jai-playground.zip --pattern jai-playground.manifest.json --dir .build/existing-jai-release
            cmp .build/existing-jai-release/jai-playground.zip .build/jai-release/jai-playground.zip
            cmp .build/existing-jai-release/jai-playground.manifest.json .build/jai-release/jai-playground.manifest.json
          else
            gh release create "$tag" .build/jai-release/jai-playground.zip .build/jai-release/jai-playground.manifest.json \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "Jai browser compiler $JAI_REF" \
              --notes 'Experimental Rust-built compiler and independently authored browser workspace. Exact revision and file digests are recorded in the manifest.'
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ inputs.update_pointer }}
      - name: Validate the consumer build
        if: ${{ inputs.update_pointer }}
        run: |
          cp .build/jai-web-release.json releases/jai-web-release.json
          pnpm install --frozen-lockfile
          pnpm test:jai
          pnpm format:check
          pnpm lint
          pnpm build
      - name: Update the deployment pointer
        if: ${{ inputs.update_pointer }}
        run: |
          git add releases/jai-web-release.json
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore: pin Jai browser compiler to $JAI_REF"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
