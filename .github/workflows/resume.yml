name: Compile Resume

on:
  push:
    branches: [main]
    paths:
      - 'resume/**'
      - 'portfolio.toml'
      - '.github/workflows/resume.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install typst
        uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          typst-version: 0.15.1

      - name: compile resume
        run: typst compile --root . resume/resume.typ --font-path resume/fonts resume.pdf

      - name: publish to github releases
        run: |
          gh release delete resume --yes 2>/dev/null || true
          gh release create resume resume.pdf \
            --title "Resume" \
            --notes "Latest compiled resume"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
